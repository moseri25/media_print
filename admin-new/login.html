<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת ניהול | מדיה פרינט</title>
    
    <!-- Favicon -->
    <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Vendor CSS Files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0563bb;
            --secondary-color: #0e2442;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }
        
        .login-card {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .login-header {
            background-color: var(--primary-color);
            padding: 2rem;
            text-align: center;
            color: #fff;
        }
        
        .login-header h2 {
            margin-bottom: 0;
            font-weight: 700;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-control {
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ced4da;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(5, 99, 187, 0.25);
        }
        
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background-color: #045aa7;
            border-color: #045aa7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(5, 99, 187, 0.2);
        }
        
        .login-footer {
            text-align: center;
            padding: 1rem 2rem 2rem;
        }
        
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .login-animation {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-card {
            animation-delay: 0.1s;
        }
        
        .alert {
            border-radius: 8px;
            font-weight: 500;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card login-animation">
            <div class="login-header">
                <h2>מערכת ניהול</h2>
                <p class="mb-0">מדיה פרינט - שילוט ומיתוג עסקים</p>
            </div>
            <div class="login-body">
                <div class="alert alert-info" role="alert">
                    <i class="fas fa-info-circle me-2"></i> לצורך הדגמה, השתמש בשם משתמש: <strong>admin</strong> וסיסמה: <strong>admin123</strong>
                </div>
                
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="username" class="form-label">שם משתמש</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" placeholder="הכנס שם משתמש" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">סיסמה</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="הכנס סיסמה" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">זכור אותי</label>
                        </div>
                        <a href="#" class="forgot-password">שכחת סיסמה?</a>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i> כניסה למערכת
                        </button>
                    </div>
                </form>
            </div>
            <div class="login-footer">
                <p class="mb-0"> 2025 מדיה פרינט. כל הזכויות שמורות.</p>
            </div>
        </div>
    </div>

    <!-- Vendor JS Files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
            
            // Login form submission
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;
                
                // Simple validation
                if (!username || !password) {
                    showAlert('נא למלא את כל השדות הנדרשים', 'danger');
                    return;
                }
                
                // Demo login check (in production, this would be an API call)
                if (username === 'admin' && password === 'admin123') {
                    // Store login state
                    if (rememberMe) {
                        localStorage.setItem('adminLoggedIn', 'true');
                        localStorage.setItem('adminUsername', username);
                    } else {
                        sessionStorage.setItem('adminLoggedIn', 'true');
                        sessionStorage.setItem('adminUsername', username);
                    }
                    
                    // Show success message and redirect
                    showAlert('התחברות מוצלחת! מעביר לדף הניהול...', 'success');
                    
                    // Redirect to dashboard after a short delay
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showAlert('שם משתמש או סיסמה שגויים', 'danger');
                }
            });
            
            // Function to show alerts
            function showAlert(message, type) {
                // Remove any existing alerts
                const existingAlert = document.querySelector('.alert-dismissible');
                if (existingAlert) {
                    existingAlert.remove();
                }
                
                // Create new alert
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
                alertDiv.role = 'alert';
                
                alertDiv.innerHTML = `
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                `;
                
                // Insert alert before the form
                const form = document.getElementById('loginForm');
                form.parentNode.insertBefore(alertDiv, form);
                
                // Auto dismiss after 5 seconds
                if (type !== 'danger') {
                    setTimeout(function() {
                        alertDiv.classList.remove('show');
                        setTimeout(function() {
                            alertDiv.remove();
                        }, 300);
                    }, 5000);
                }
            }
            
            // Check if user is already logged in
            function checkLoginStatus() {
                const isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true' || 
                                  sessionStorage.getItem('adminLoggedIn') === 'true';
                
                if (isLoggedIn) {
                    window.location.href = 'index.html';
                }
            }
            
            // Check login status on page load
            checkLoginStatus();
            
            // Handle forgot password
            const forgotPasswordLink = document.querySelector('.forgot-password');
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                showAlert('לצורך איפוס סיסמה, אנא פנה למנהל המערכת', 'info');
            });
        });
    </script>
</body>
</html>
