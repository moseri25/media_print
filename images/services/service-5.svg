<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Car silhouette -->
  <rect x="100" y="200" width="400" height="100" rx="20" fill="#6c757d"/>
  <rect x="150" y="150" width="300" height="50" rx="10" fill="#6c757d"/>
  <rect x="150" y="300" width="80" height="40" rx="20" fill="#343a40"/>
  <rect x="370" y="300" width="80" height="40" rx="20" fill="#343a40"/>
  
  <!-- Vehicle branding -->
  <rect x="200" y="170" width="200" height="100" fill="#0056b3"/>
  <text x="300" y="220" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">מדיה פרינט</text>
  <text x="300" y="250" text-anchor="middle" font-family="Arial" font-size="16" fill="white">שילוט ומיתוג מקצועי</text>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0056b3">מיתוג רכבים</text>
</svg>
