<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Office interior -->
  <rect x="50" y="50" width="500" height="300" fill="#e9ecef"/>
  <rect x="100" y="100" width="400" height="200" fill="#dee2e6"/>
  
  <!-- Indoor sign -->
  <rect x="150" y="150" width="300" height="100" rx="5" fill="#ffffff"/>
  <rect x="170" y="170" width="260" height="60" rx="3" fill="#0056b3"/>
  <text x="300" y="210" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">מדיה פרינט</text>
  
  <!-- Office furniture silhouettes -->
  <rect x="150" y="270" width="100" height="30" fill="#6c757d"/>
  <rect x="350" y="270" width="100" height="30" fill="#6c757d"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0056b3">שילוט פנים מעוצב</text>
</svg>
