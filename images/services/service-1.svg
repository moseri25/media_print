<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Building silhouette -->
  <rect x="100" y="100" width="400" height="250" fill="#dee2e6"/>
  <rect x="150" y="150" width="300" height="200" fill="#ced4da"/>
  
  <!-- Outdoor sign -->
  <rect x="200" y="50" width="200" height="80" rx="5" fill="#0056b3"/>
  <text x="300" y="100" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="white">מדיה פרינט</text>
  
  <!-- Sign support -->
  <rect x="290" y="130" width="20" height="20" fill="#6c757d"/>
  
  <!-- Title -->
  <text x="300" y="350" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0056b3">שילוט חוץ מקצועי</text>
</svg>
