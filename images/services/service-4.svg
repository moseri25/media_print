<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Large format printer -->
  <rect x="150" y="100" width="300" height="150" rx="10" fill="#6c757d"/>
  <rect x="180" y="130" width="240" height="90" rx="5" fill="#495057"/>
  
  <!-- Printing output -->
  <rect x="100" y="250" width="400" height="100" fill="#0056b3" fill-opacity="0.8"/>
  <text x="300" y="310" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="white">מדיה פרינט</text>
  
  <!-- Printer details -->
  <rect x="200" y="150" width="200" height="10" fill="#ced4da"/>
  <rect x="200" y="170" width="200" height="10" fill="#ced4da"/>
  <rect x="200" y="190" width="200" height="10" fill="#ced4da"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0056b3">דפוס פורמט רחב</text>
</svg>
