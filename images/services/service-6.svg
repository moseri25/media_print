<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Computer screen -->
  <rect x="150" y="100" width="300" height="200" rx="10" fill="#343a40"/>
  <rect x="170" y="120" width="260" height="160" rx="5" fill="#ffffff"/>
  
  <!-- Design elements on screen -->
  <rect x="200" y="150" width="200" height="80" fill="#0056b3" fill-opacity="0.8"/>
  <text x="300" y="195" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">מדיה פרינט</text>
  
  <circle cx="230" cy="250" r="20" fill="#0056b3"/>
  <rect x="270" y="240" width="120" height="20" rx="5" fill="#dee2e6"/>
  
  <!-- Computer stand -->
  <rect x="280" y="300" width="40" height="20" fill="#6c757d"/>
  <rect x="260" y="320" width="80" height="10" fill="#6c757d"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0056b3">עיצוב גרפי</text>
</svg>
