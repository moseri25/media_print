<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#f8f9fa"/>
  
  <!-- Profile background -->
  <rect x="200" y="100" width="200" height="200" rx="100" fill="#e9ecef"/>
  
  <!-- Person silhouette -->
  <circle cx="300" cy="150" r="50" fill="#6c757d"/>
  <rect x="275" y="200" width="50" height="60" rx="25" fill="#6c757d"/>
  
  <!-- Testimonial box -->
  <rect x="100" y="320" width="400" height="200" rx="10" fill="#0056b3" fill-opacity="0.1"/>
  <rect x="120" y="340" width="360" height="160" rx="5" fill="#ffffff"/>
  
  <!-- Quote marks -->
  <text x="140" y="380" font-family="Arial" font-size="60" fill="#0056b3" fill-opacity="0.2">"</text>
  <text x="460" y="460" font-family="Arial" font-size="60" fill="#0056b3" fill-opacity="0.2">"</text>
  
  <!-- Testimonial text -->
  <text x="300" y="400" text-anchor="middle" font-family="Arial" font-size="14" fill="#6c757d">מיתוג הרכבים של החברה שלנו יצא מושלם.</text>
  <text x="300" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#6c757d">עמדו בלוחות הזמנים והתוצאה מרשימה ביותר.</text>
  
  <!-- Person details -->
  <text x="300" y="470" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#0056b3">אבי שמעוני</text>
  <text x="300" y="490" text-anchor="middle" font-family="Arial" font-size="14" fill="#6c757d">מנהל לוגיסטיקה, שמעוני הובלות</text>
</svg>
