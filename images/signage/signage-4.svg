<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#212529"/>
  
  <!-- Neon sign tubes -->
  <g stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Letter מ -->
    <path d="M150,150 L150,230 L180,230 L180,150" />
    
    <!-- Letter ד -->
    <path d="M200,150 L200,230 L230,230 L230,150" />
    
    <!-- Letter י -->
    <path d="M250,150 L250,230" />
    
    <!-- Letter ה -->
    <path d="M270,150 L270,230 L300,230 L300,150 M270,190 L300,190" />
    
    <!-- Letter פ -->
    <path d="M320,150 L320,230 L350,230 L350,150 M320,190 L350,190" />
    
    <!-- Letter ר -->
    <path d="M370,150 L370,230 L400,230 L400,190" />
  </g>
  
  <!-- Neon glow effect -->
  <g stroke="#ff6b6b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3" fill="none">
    <!-- Letter מ -->
    <path d="M150,150 L150,230 L180,230 L180,150" />
    
    <!-- Letter ד -->
    <path d="M200,150 L200,230 L230,230 L230,150" />
    
    <!-- Letter י -->
    <path d="M250,150 L250,230" />
    
    <!-- Letter ה -->
    <path d="M270,150 L270,230 L300,230 L300,150 M270,190 L300,190" />
    
    <!-- Letter פ -->
    <path d="M320,150 L320,230 L350,230 L350,150 M320,190 L350,190" />
    
    <!-- Letter ר -->
    <path d="M370,150 L370,230 L400,230 L400,190" />
  </g>
  
  <g stroke="#ff6b6b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.1" fill="none">
    <!-- Letter מ -->
    <path d="M150,150 L150,230 L180,230 L180,150" />
    
    <!-- Letter ד -->
    <path d="M200,150 L200,230 L230,230 L230,150" />
    
    <!-- Letter י -->
    <path d="M250,150 L250,230" />
    
    <!-- Letter ה -->
    <path d="M270,150 L270,230 L300,230 L300,150 M270,190 L300,190" />
    
    <!-- Letter פ -->
    <path d="M320,150 L320,230 L350,230 L350,150 M320,190 L350,190" />
    
    <!-- Letter ר -->
    <path d="M370,150 L370,230 L400,230 L400,190" />
  </g>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ffffff">שלט נאון</text>
