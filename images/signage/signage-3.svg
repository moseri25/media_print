<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#212529"/>
  
  <!-- Digital LED sign frame -->
  <rect x="100" y="100" width="400" height="200" rx="10" fill="#343a40"/>
  <rect x="110" y="110" width="380" height="180" rx="5" fill="#000000"/>
  
  <!-- LED display content -->
  <rect x="120" y="120" width="360" height="160" rx="3" fill="#0056b3"/>
  
  <!-- LED pixels effect -->
  <g>
    <rect x="130" y="130" width="5" height="5" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="140" y="130" width="5" height="5" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="150" y="130" width="5" height="5" fill="#ffffff" fill-opacity="0.9"/>
    <!-- More pixels would be added here in a real implementation -->
  </g>
  
  <!-- Display text -->
  <text x="300" y="180" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="#ffffff">מדיה פרינט</text>
  <text x="300" y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#ffffff">שילוט דיגיטלי מתקדם</text>
  
  <!-- Light glow effect -->
  <rect x="120" y="120" width="360" height="160" rx="3" fill="#ffffff" fill-opacity="0.1"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ffffff">שלט דיגיטלי</text>
</svg>
