<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Office wall background -->
  <rect x="50" y="50" width="500" height="300" fill="#e9ecef"/>
  
  <!-- Frameless sign - transparent acrylic effect -->
  <rect x="150" y="150" width="300" height="100" fill="#0056b3" fill-opacity="0.2"/>
  
  <!-- Text on transparent sign -->
  <text x="300" y="200" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="#0056b3">מדיה פרינט</text>
  <text x="300" y="240" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">שילוט ומיתוג מקצועי</text>
  
  <!-- Mounting hardware -->
  <circle cx="170" cy="160" r="5" fill="#adb5bd"/>
  <circle cx="430" cy="160" r="5" fill="#adb5bd"/>
  <circle cx="170" cy="240" r="5" fill="#adb5bd"/>
  <circle cx="430" cy="240" r="5" fill="#adb5bd"/>
  
  <!-- Shadow effect -->
  <rect x="155" y="155" width="300" height="100" fill="#000000" fill-opacity="0.05"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0056b3">שלט פריימלס</text>
</svg>
