<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#212529"/>
  
  <!-- Lightbox sign -->
  <rect x="150" y="100" width="300" height="150" rx="10" fill="#0056b3"/>
  <rect x="160" y="110" width="280" height="130" rx="5" fill="#ffffff"/>
  
  <!-- Text in lightbox -->
  <text x="300" y="180" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="#0056b3">מדיה פרינט</text>
  <text x="300" y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#0056b3">שילוט ומיתוג מקצועי</text>
  
  <!-- Light glow effect -->
  <rect x="150" y="100" width="300" height="150" rx="10" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="140" y="90" width="320" height="170" rx="15" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="130" y="80" width="340" height="190" rx="20" fill="#ffffff" fill-opacity="0.05"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ffffff">שלט קופסא מואר</text>
</svg>
