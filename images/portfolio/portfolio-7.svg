<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Banner structure -->
  <rect x="150" y="100" width="300" height="200" fill="#ffffff"/>
  <rect x="145" y="95" width="310" height="210" stroke="#dee2e6" stroke-width="5" fill="none"/>
  
  <!-- Banner content -->
  <rect x="170" y="120" width="260" height="160" fill="#0056b3" fill-opacity="0.1"/>
  <text x="300" y="180" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0056b3">מדיה פרינט</text>
  <text x="300" y="220" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">שילוט ומיתוג מקצועי לעסקים</text>
  
  <!-- Decorative elements -->
  <rect x="200" y="150" width="200" height="2" fill="#0056b3"/>
  <rect x="200" y="250" width="200" height="2" fill="#0056b3"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">באנר פרסומי</text>
</svg>
