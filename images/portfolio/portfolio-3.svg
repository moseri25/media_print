<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Store window -->
  <rect x="100" y="100" width="400" height="200" fill="#ffffff"/>
  <rect x="90" y="90" width="420" height="220" stroke="#dee2e6" stroke-width="5" fill="none"/>
  
  <!-- Window branding -->
  <rect x="150" y="150" width="300" height="100" fill="#0056b3" fill-opacity="0.3"/>
  <text x="300" y="200" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0056b3">מדיה פרינט</text>
  <text x="300" y="240" text-anchor="middle" font-family="Arial" font-size="16" fill="#0056b3">שילוט ומיתוג מקצועי</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="20" fill="#0056b3" fill-opacity="0.2"/>
  <circle cx="400" cy="150" r="20" fill="#0056b3" fill-opacity="0.2"/>
  <circle cx="200" cy="250" r="20" fill="#0056b3" fill-opacity="0.2"/>
  <circle cx="400" cy="250" r="20" fill="#0056b3" fill-opacity="0.2"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">מיתוג חלון ראווה</text>
</svg>
