<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Office interior -->
  <rect x="100" y="100" width="400" height="200" fill="#e9ecef"/>
  
  <!-- Reception desk -->
  <rect x="150" y="200" width="150" height="50" fill="#adb5bd"/>
  <rect x="150" y="250" width="150" height="10" fill="#6c757d"/>
  
  <!-- Wall sign -->
  <rect x="350" y="150" width="100" height="50" fill="#0056b3"/>
  <text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">מדיה פרינט</text>
  
  <!-- Reception sign -->
  <rect x="170" y="180" width="80" height="20" fill="#0056b3"/>
  <text x="210" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="white">קבלה</text>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">שילוט פנים למשרד</text>
</svg>
