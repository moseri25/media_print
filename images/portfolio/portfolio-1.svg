<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Store front with large sign -->
  <rect x="100" y="100" width="400" height="200" fill="#dee2e6"/>
  <rect x="150" y="50" width="300" height="80" fill="#0056b3"/>
  
  <!-- Sign content -->
  <text x="300" y="100" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="white">מדיה פרינט</text>
  
  <!-- Store windows -->
  <rect x="150" y="150" width="100" height="150" fill="#ffffff"/>
  <rect x="350" y="150" width="100" height="150" fill="#ffffff"/>
  
  <!-- Door -->
  <rect x="275" y="200" width="50" height="100" fill="#6c757d"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">שילוט חוץ לחנות</text>
</svg>
