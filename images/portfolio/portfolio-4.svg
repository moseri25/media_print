<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Car silhouette -->
  <rect x="150" y="200" width="300" height="80" rx="20" fill="#6c757d"/>
  <rect x="200" y="150" width="200" height="50" rx="10" fill="#6c757d"/>
  <rect x="200" y="280" width="60" height="30" rx="15" fill="#343a40"/>
  <rect x="340" y="280" width="60" height="30" rx="15" fill="#343a40"/>
  
  <!-- Car branding -->
  <rect x="220" y="170" width="160" height="80" fill="#0056b3"/>
  <text x="300" y="210" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">מדיה פרינט</text>
  <text x="300" y="235" text-anchor="middle" font-family="Arial" font-size="14" fill="white">שילוט ומיתוג מקצועי</text>
  
  <!-- Logo element -->
  <circle cx="250" cy="210" r="15" fill="#ffffff" fill-opacity="0.5"/>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">מיתוג רכב מסחרי</text>
</svg>
