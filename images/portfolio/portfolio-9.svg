<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Brochure layout -->
  <g transform="translate(150, 100)">
    <!-- Brochure cover -->
    <rect width="150" height="200" fill="#0056b3"/>
    <text x="75" y="100" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">מדיה פרינט</text>
    <text x="75" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="white">שילוט ומיתוג מקצועי</text>
    <rect x="50" y="150" width="50" height="2" fill="white"/>
    
    <!-- Brochure inside pages -->
    <g transform="translate(150, 0)">
      <rect width="150" height="200" fill="#ffffff"/>
      <rect x="20" y="30" width="110" height="10" fill="#dee2e6"/>
      <rect x="20" y="50" width="110" height="10" fill="#dee2e6"/>
      <rect x="20" y="70" width="110" height="10" fill="#dee2e6"/>
      <rect x="20" y="90" width="110" height="10" fill="#dee2e6"/>
      <rect x="20" y="120" width="50" height="50" fill="#0056b3" fill-opacity="0.2"/>
      <rect x="80" y="120" width="50" height="50" fill="#0056b3" fill-opacity="0.2"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="18" fill="#0056b3">עיצוב ברושור</text>
</svg>
