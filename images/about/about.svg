<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Office background -->
  <rect x="50" y="50" width="700" height="500" rx="10" fill="#e9ecef"/>
  <rect x="100" y="100" width="300" height="200" rx="5" fill="#dee2e6"/>
  <rect x="450" y="100" width="250" height="150" rx="5" fill="#dee2e6"/>
  <rect x="100" y="350" width="600" height="150" rx="5" fill="#dee2e6"/>
  
  <!-- Printing equipment -->
  <rect x="150" y="150" width="200" height="100" rx="5" fill="#0056b3" fill-opacity="0.8"/>
  <rect x="180" y="180" width="140" height="40" rx="3" fill="#ffffff"/>
  <rect x="200" y="200" width="100" height="10" rx="2" fill="#0056b3"/>
  
  <!-- People silhouettes -->
  <circle cx="500" cy="150" r="40" fill="#0056b3" fill-opacity="0.8"/>
  <rect x="485" y="190" width="30" height="80" fill="#0056b3" fill-opacity="0.8"/>
  <rect x="470" y="270" width="60" height="30" fill="#0056b3" fill-opacity="0.8"/>
  
  <circle cx="600" cy="170" r="30" fill="#0056b3" fill-opacity="0.8"/>
  <rect x="590" y="200" width="20" height="60" fill="#0056b3" fill-opacity="0.8"/>
  <rect x="580" y="260" width="40" height="20" fill="#0056b3" fill-opacity="0.8"/>
  
  <!-- Signage examples -->
  <rect x="150" y="400" width="200" height="50" rx="5" fill="#0056b3"/>
  <text x="250" y="435" text-anchor="middle" font-family="Arial" font-size="24" fill="white">מדיה פרינט</text>
  
  <rect x="400" y="400" width="250" height="50" rx="5" fill="#0056b3"/>
  <text x="525" y="435" text-anchor="middle" font-family="Arial" font-size="24" fill="white">שילוט ומיתוג מקצועי</text>
  
  <!-- Company name -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0056b3">מדיה פרינט - אודות</text>
</svg>
